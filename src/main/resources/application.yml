spring:
  application:
    name: durableflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:durableflow}}
    username: ${DB_USERNAME:durableflow}
    password: ${DB_PASSWORD:durableflow_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.json_format_mapper: jackson
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
durableflow:
  timers:
    polling-enabled: ${TIMER_POLLING_ENABLED:true}
    poll-delay-ms: ${TIMER_POLL_DELAY_MS:500}
  children:
    polling-enabled: ${CHILD_POLLING_ENABLED:true}
    poll-delay-ms: ${CHILD_POLL_DELAY_MS:500}
    max-depth: ${CHILD_MAX_DEPTH:8}
  schedules:
    polling-enabled: ${SCHEDULE_POLLING_ENABLED:true}
    poll-delay-ms: ${SCHEDULE_POLL_DELAY_MS:500}
    max-catch-up-occurrences: ${SCHEDULE_MAX_CATCH_UP:10}
